<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Manual accounts</title><body><main><a href="/">Back to Minty</a><h1>Manual accounts</h1><p>Add unsupported accounts and update their balances here. Enter amounts owed as positive balances for credit cards and loans.</p><form id="form"><input id="accountId" type="hidden"><label>Owner <select id="owner"></select></label><label>Name <input id="name" required maxlength="100"></label><label>Type <select id="type"><option value="depository">Cash / bank</option><option value="credit">Credit card</option><option value="loan">Loan</option><option value="investment">Investment</option></select></label><label>Currency <input id="currency" value="USD" pattern="[A-Z]{3}" required></label><label>Balance <input id="balance" type="number" step="0.01" required></label><button>Save account</button><button type="reset">New account</button></form><p id="status" role="status"></p><div id="list"></div></main><script src="/manual.js"></script></body></html>
